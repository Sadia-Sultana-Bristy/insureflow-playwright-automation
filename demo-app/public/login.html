<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | InsureFlow</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-body">
  <main class="auth-card">
    <div class="brand">InsureFlow</div>
    <h1>Sign in to your account</h1>
    <p class="subtitle">Manage policies, quotes and claims in one place.</p>
    <div class="alert alert-info" data-testid="login-info" role="status" hidden></div>
    <div class="alert alert-error" data-testid="login-alert" role="alert" hidden></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" data-testid="email-input">
        <p class="field-error" data-error-for="email" data-testid="email-error" hidden></p>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" data-testid="password-input">
        <p class="field-error" data-error-for="password" data-testid="password-error" hidden></p>
      </div>
      <button type="submit" class="btn btn-primary" data-testid="login-button">Sign in</button>
    </form>
    <p class="hint">Demo account: alex.morgan@insureflow.test / Secure@123</p>
  </main>
  <script src="js/app.js"></script>
  <script src="js/pages/login.js"></script>
</body>
</html>
